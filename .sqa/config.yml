      github.com/ARGOeu/argo-scg flake8:
        commands:
        - /usr/bin/env sh .sqa/script.thistle_artistic_narwhal.sh
        container: qc.sty_fandango_bold_hawk
  QC.Uni:
    repos:
      github.com/ARGOeu/argo-scg pytest:
        commands:
        - /usr/bin/env sh .sqa/script.jasmine_artistic_komodo.sh
        container: qc.uni_pink_respectful_beaver
  QC.Ver:
    repos:
      github.com/ARGOeu/argo-scg get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.blush_restless_snail.sh
        container: qc.ver_emerald_responsible_camel
